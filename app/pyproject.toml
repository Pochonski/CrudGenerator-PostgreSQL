[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crud-generator-postgresql"
version = "0.1.0"
description = "Aplicación Python para administrar la generación automática de procedimientos CRUD en PostgreSQL"
requires-python = ">=3.11"

dependencies = [
    "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff"
]

[project.scripts]
crudgen = "crud_generator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas opcionales contra PostgreSQL real (omitidas sin CRUDGEN_TEST_POSTGRES=1)",
]

[tool.ruff]
line-length = 100