name: SQL test harness

on:
  push:
    branches: ["main", "joseph/**"]
  pull_request:
    branches: ["main"]

jobs:
  sql-harness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d devdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: devdb
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL security and integration harness
        run: bash tests/run_harness.sh
